name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ROOT=""
          for s in $(find . -name settings.gradle.kts); do
            d=$(dirname "$s")
            if grep -rq "createScreenCaptureIntent" "$d"; then ROOT="$d"; fi
          done
          echo "Bulunan projeler:"; find . -name settings.gradle.kts
          if [ -z "$ROOT" ]; then echo "HATA: Yeni kod repoda yok"; exit 1; fi
          cd "$ROOT"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Rebirth-APK
          path: "**/app-debug.apk"
